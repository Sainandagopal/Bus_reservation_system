spring.application.name=mango-bus-api
server.port=${PORT:8080}

# Local HTTPS. start-backend.ps1 creates this self-signed localhost certificate once.
server.ssl.enabled=${MANGO_SSL_ENABLED:true}
server.ssl.key-store=${MANGO_SSL_KEYSTORE:file:./mango-localhost.p12}
server.ssl.key-store-password=${MANGO_SSL_KEYSTORE_PASSWORD:mango-local-dev}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=mango-localhost

# File-backed H2 database keeps route, account and reservation data between restarts.
spring.datasource.url=jdbc:h2:file:./data/mango-bus-db;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# Demo Admin is created once if no admin account exists. Override before first run.
mango.admin.username=${MANGO_ADMIN_USERNAME:admin}
mango.admin.password=${MANGO_ADMIN_PASSWORD:Admin@123}

# Main UI is served by the same Spring Boot origin. These values only support optional Vite development.
app.frontend-origin=${FRONTEND_ORIGIN:https://localhost:8080}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=45m
